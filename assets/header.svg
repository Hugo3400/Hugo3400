<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Hugo — Développeur indépendant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.18" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#c0caf5" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="300" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect width="1280" height="300" fill="url(#dots)"/>
    <rect width="1280" height="300" fill="url(#glowL)"/>
    <rect width="1280" height="300" fill="url(#glowR)"/>
    <rect y="294" width="1280" height="6" fill="url(#accent)"/>
  </g>

  <!-- window dots -->
  <circle cx="44" cy="40" r="7" fill="#f7768e"/>
  <circle cx="68" cy="40" r="7" fill="#e0af68"/>
  <circle cx="92" cy="40" r="7" fill="#9ece6a"/>

  <!-- prompt line -->
  <text x="640" y="78" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="20" fill="#565f89">~/hugo3400 <tspan fill="#9ece6a">$</tspan> <tspan fill="#7dcfff">whoami</tspan></text>

  <!-- name -->
  <text x="640" y="178" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="url(#accent)">Hugo</text>

  <!-- tagline -->
  <text x="640" y="226" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#c0caf5">Développeur indépendant  ·  France</text>
  <text x="640" y="260" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" letter-spacing="3" fill="#737aa2">APPLICATIONS  ·  OUTILS  ·  BOTS DISCORD</text>
</svg>
